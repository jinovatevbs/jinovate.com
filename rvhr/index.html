<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1F3C88">

<style>
:root{--bg:#f3f5fa;--surface:#fff;--surface-2:#eef1f8;--fg:#18203a;--muted:#5d6782;--line:#dde2ee;--brand:#1F3C88;--brand-fg:#fff;--brand-soft:#e4eaf8;--ok:#1E8449;--warn:#B9770E;--bad:#C0392B;--info:#2E57B5;--idle:#7a8297;--violet:#6a5acd;--pend:#8e44ad}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand b{font-size:20px;color:var(--brand);display:block}.brand span{font-size:12px;color:var(--muted)}
select,input,button,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=tel],input[type=email],input[type=number],input[type=password],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--brand);color:var(--brand-fg)}.ghost{background:var(--surface-2)}.okb{background:var(--ok);color:#fff}.badb{background:var(--bad);color:#fff}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav.tabs button{background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-weight:500}
nav.tabs button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
h3{font-size:18px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.n{font-size:30px;font-weight:700}
.big{font-size:40px;font-weight:700;color:var(--brand)}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--brand)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.t{font-weight:600}
.chip,.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;color:#fff;white-space:nowrap}
.c-Interested{background:var(--idle)}.c-Interview{background:var(--info)}.c-aaya{background:var(--violet)}.c-Selected{background:var(--warn)}.c-pending{background:var(--pend)}.c-Joined{background:var(--ok)}.c-Rejected{background:var(--bad)}
.p-ok{background:var(--ok)}.p-warn{background:var(--warn)}.p-bad{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.actions button{padding:6px 10px;font-size:13px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.form{display:grid;gap:10px}.form2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
.zone{border-radius:12px;padding:12px;color:#fff;font-weight:600}
.err{color:var(--bad);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--fg);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:92vw}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:16px;overflow-y:auto}
.modal .panel{max-width:560px;width:100%;margin-block:16px}
.rules{white-space:pre-line;background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:14px}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--info);z-index:40}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

/* ---- app look (PWA) ---- */
body{font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;background:linear-gradient(180deg,#e9eefb 0,#f3f5fa 260px);-webkit-tap-highlight-color:transparent}
.wrap{padding:0 14px 90px}
header.top{position:relative;z-index:15;margin:0 -14px 14px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(135deg,#1F3C88,#2E57B5);color:#fff;box-shadow:0 4px 14px rgba(31,60,136,.25);border-radius:0 0 18px 18px;flex-wrap:nowrap}
header.top .brand{display:grid;grid-template-columns:40px 1fr;column-gap:10px;align-items:center;min-width:0}
header.top .brand:before{content:"";grid-row:1/3;width:40px;height:40px;border-radius:11px;background:#fff url(icon-192.png) center/cover;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.brand b{color:#fff;font-size:16.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{color:rgba(255,255,255,.82);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .ghost{background:rgba(255,255,255,.16);color:#fff;font-size:13px;padding:8px 12px;white-space:nowrap}
html{background:#f3f5fa}nav.tabs{position:sticky;top:0;z-index:14;margin:0 -14px 12px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(243,245,250,.92);backdrop-filter:blur(8px);scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border-radius:999px;padding:8px 15px;box-shadow:0 1px 2px rgba(20,30,60,.06)}
.panel{border:0;border-radius:18px;box-shadow:0 1px 3px rgba(20,30,60,.07),0 6px 20px rgba(20,30,60,.05)}
.item{border:0;background:var(--surface-2);border-radius:14px}
button{border-radius:12px;transition:transform .08s,filter .15s}button:active{transform:scale(.97);filter:brightness(.95)}
.primary{background:linear-gradient(135deg,#1F3C88,#2E57B5);box-shadow:0 4px 12px rgba(31,60,136,.25)}
select,input[type=text],input[type=tel],input[type=email],input[type=number],input[type=password],input[type=date],textarea{font-size:16px;padding:11px 13px;border-radius:12px;background:#fbfcfe}
input:focus,select:focus,textarea:focus{outline:2px solid #2E57B5;outline-offset:0;border-color:transparent}
.n{font-size:32px}.big{font-size:44px}
.zone{border-radius:16px;padding:14px 16px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.busy{height:3px;background:linear-gradient(90deg,transparent,#5b8cff,transparent);background-size:50% 100%;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:-50% 0}to{background-position:150% 0}}
.toast{bottom:calc(22px + env(safe-area-inset-bottom));border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal .panel{border-radius:20px}
input[type=file]{font-size:14px;color:var(--muted);width:100%}input[type=file]::file-selector-button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 14px;margin-right:10px;background:var(--brand-soft);color:var(--brand)}
.credit{text-align:center;font-size:11px;color:var(--muted);margin:26px 0 0}
#installBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#18203a;color:#fff;padding:10px 12px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px}
#installBar button{padding:8px 14px}
@media (min-width:760px){.wrap{padding:0 24px 60px}header.top{margin:0 -24px 16px;border-radius:0}}
</style></head>
<body>
<div id="busy" class="busy" hidden></div>
<div class="wrap">
  <header class="top"><div class="brand"><b>RV HR Recruiter Tracker</b><span id="sub">RV HR Carrers Pvt. Ltd.</span></div>
    <button class="ghost" id="logoutBtn" hidden>Logout</button></header>
  <div id="asBar" class="panel" style="background:var(--warn);color:#fff;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px" hidden><span id="asTxt"></span><button class="ghost" id="asBack">Master par wapas</button></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<p class="credit">Powered by Jinovate — Smart solutions for your business</p>
<div id="installBar" hidden><span>📲 Phone par app install karein</span><span><button class="ghost" id="ibNo" style="background:transparent;color:#cfd6ea">Baad me</button> <button class="primary" id="ibYes">Install</button></span></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
/* google.script.run shim -> Apps Script JSON API */
(function(){var API='https://script.google.com/macros/s/AKfycbwGpXwX-u0bof3JdouHemOBxjZ30kvJBpthvuREt1tGhIOkcaNUd1WDPErOcpI6wZY7uA/exec';
function mk(ok,fail){return new Proxy({},{get:function(t,p){
 if(p==='withSuccessHandler')return function(f){return mk(f,fail)};
 if(p==='withFailureHandler')return function(f){return mk(ok,f)};
 return function(){var args=[].slice.call(arguments);
  fetch(API,{method:'POST',body:JSON.stringify({fn:p,args:args}),redirect:'follow'})
  .then(function(r){return r.json()})
  .then(function(j){if(j.ok){ok&&ok(j.data)}else{fail&&fail({message:j.error})}})
  .catch(function(){fail&&fail({message:'Internet issue – network check karke dobara try karein'})})}}})}
window.google={script:{run:mk()}};
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})}
var dp=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;var b=document.getElementById('installBar');if(b&&!localStorage.getItem('ib_no'))b.hidden=false});
document.addEventListener('click',function(e){var b=document.getElementById('installBar');if(!b)return;
 if(e.target.id==='ibYes'&&dp){dp.prompt();dp.userChoice.then(function(){b.hidden=true;dp=null})}
 if(e.target.id==='ibNo'){b.hidden=true;try{localStorage.setItem('ib_no','1')}catch(_){}}});
})();
</script>
<script>
var TOKEN=null, ME=null, TAB=null, HOME=null, ADMIN=null, MASTER=null, MDATA=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},3000)}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
try{TOKEN=localStorage.getItem('rvhr_tok');ME=JSON.parse(localStorage.getItem('rvhr_me')||'null');MASTER=JSON.parse(localStorage.getItem('rvhr_master')||'null')}catch(e){}
function saveSess(){try{localStorage.setItem('rvhr_tok',TOKEN||'');localStorage.setItem('rvhr_me',JSON.stringify(ME));localStorage.setItem('rvhr_master',JSON.stringify(MASTER))}catch(e){}}
/** call server: run('fn', args..., cb) */
function run(fn){var args=[].slice.call(arguments,1),cb=args.pop();$('#busy').hidden=false;
  var r=google.script.run.withSuccessHandler(function(x){$('#busy').hidden=true;cb(x)}).withFailureHandler(function(e){$('#busy').hidden=true;
    var m=(e&&e.message)||String(e); if(m.indexOf('SESSION')>=0){logout();toast(m.replace('SESSION: ',''));return} toast(m)});
  r[fn].apply(r,args)}
function logout(){TOKEN=null;ME=null;MASTER=null;try{localStorage.removeItem('rvhr_tok');localStorage.removeItem('rvhr_me');localStorage.removeItem('rvhr_master')}catch(e){}render()}
$('#asBack').onclick=function(){TOKEN=MASTER.token;ME=MASTER.me;MASTER=null;TAB='as';saveSess();render()};
$('#logoutBtn').onclick=logout;

/* image -> compressed dataURL */
function readImg(file,max,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.8))};im.src=fr.result};fr.readAsDataURL(file)}
function gps(cb){if(!navigator.geolocation){toast('Phone me location support nahi');return}
 navigator.geolocation.getCurrentPosition(function(p){cb(p.coords.latitude,p.coords.longitude,p.coords.accuracy)},function(){toast('Location nahi mili – GPS on karo aur browser ko location ki permission do')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}

/* ---------------- login ---------------- */
function viewLogin(){$('#tabs').innerHTML='';$('#logoutBtn').hidden=true;$('#sub').textContent='RV HR Carrers Pvt. Ltd.';
 $('#view').innerHTML='<div class="panel" style="max-width:380px;margin:30px auto"><h3>Login</h3><form class="form" id="lf"><label>Code<input type="text" id="lc" placeholder="Jaise RV0008" autocomplete="username"></label><label>PIN<input type="password" id="lp" inputmode="numeric" autocomplete="current-password"></label><button class="primary">Login</button></form><p class="muted">Code aur PIN Vinod ji se milega.</p></div>';
 $('#lf').onsubmit=function(e){e.preventDefault();run('login',$('#lc').value,$('#lp').value,function(r){TOKEN=r.token;ME=r.me;try{localStorage.setItem('rvhr_tok',TOKEN);localStorage.setItem('rvhr_me',JSON.stringify(ME))}catch(x){}TAB=null;render()})}}

function tabs(list){if(!TAB)TAB=list[0][0];$('#tabs').innerHTML=list.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===TAB?'on':'')+'">'+t[1]+'</button>'}).join('');
 [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){TAB=b.dataset.t;render()}})}

function render(){ if(!TOKEN||!ME) return viewLogin();
 $('#asBar').hidden=!MASTER; if(MASTER)$('#asTxt').textContent='Master: aap abhi '+ME.name+' ('+ME.code+') ke roop me dekh rahe ho – har action log hota hai';
 if(ME.role==='Master'){tabs([['mhome','Master'],['dash','Recruiters aaj'],['appr','Approvals'],['req','Permissions'],['open','Openings'],['team','Allocation'],['pay','Payroll'],['month','Month-wise'],['reset','Reset'],['q','Nirmala ka kaam'],['cands','Sab Candidates'],['att','Attendance'],['users','Logins & PIN'],['set','Settings'],['as','Login as']]);
   if(TAB==='q')return compView(); if(['dash','appr','req','open','team','pay','month','reset'].indexOf(TAB)>=0)return adminView(); return masterView()}
 $('#logoutBtn').hidden=false;$('#sub').textContent=ME.name+' · '+ME.code+' · '+(ME.role==='Recruiter'?ME.designation:ME.role);
 if(ME.role==='Admin'){tabs([['dash','Dashboard'],['appr','Joining Approvals'],['req','Permissions'],['open','Openings'],['team','Recruiters'],['pay','Payroll Check'],['month','Month-wise'],['reset','Reset']]);return adminView()}
 if(ME.role==='Compliance'){tabs([['q','Mera Kaam']]);return compView()}
 tabs([['home','Aaj'],['cand','Mere Candidates'],['add','+ Naya Candidate'],['open','Openings'],['rules','Manual']]);recView()}

/* ---------------- recruiter ---------------- */
function recView(){ if(TAB==='add') return run('getOpenings',TOKEN,viewAdd);
 if(TAB==='open') return run('getOpenings',TOKEN,viewOpenings);
 if(TAB==='cand') return run('getMyCandidates',TOKEN,viewCands);
 run('getHome',TOKEN,function(h){HOME=h;ME=h.me;if(!ME.accepted)return viewGate();TAB==='rules'?viewRules():viewHome()})}
function viewGate(){$('#view').innerHTML='<div class="panel"><h3>Pehli baar login – '+esc(ME.name)+'</h3><p>Pad: '+esc(ME.designation)+' · Monthly joining target: <b>'+ME.target+'</b> · Clients: '+esc(ME.clients.join(', '))+'</p><h4>Recruiter Manual</h4><div class="rules">'+esc(HOME.manual)+'</div>'+
 '<label class="chk"><input type="checkbox" id="a1"> Maine Offer Letter padh liya aur accept karta/karti hoon</label><label class="chk"><input type="checkbox" id="a2"> Maine Manual & Rules padh liye aur follow karunga/karungi</label><div class="actions"><button class="primary" id="ab" disabled>Accept karo</button></div></div>';
 var ck=function(){$('#ab').disabled=!($('#a1').checked&&$('#a2').checked)};$('#a1').onchange=ck;$('#a2').onchange=ck;
 $('#ab').onclick=function(){run('acceptTerms',TOKEN,function(){toast('Accept ho gaya');render()})}}
function viewRules(){$('#view').innerHTML='<div class="panel"><h3>Recruiter Manual</h3><div class="rules">'+esc(HOME.manual)+'</div></div>'}
function zoneHtml(a){var red=/^Red/.test(a.zone),warn=/^Late$|^Check/.test(a.zone);return '<div class="zone" style="background:var('+(red?'--bad':warn?'--warn':'--ok')+')">'+esc(a.zone)+'<br><span style="font-weight:400">Check-in '+esc(a.in)+' · Pincode '+esc(a.pin||'—')+(a.dist!==''?' · ghar se '+esc(a.dist)+' m':'')+(a.out?' · Logout '+esc(a.out):'')+'</span></div>'}
function viewHome(){var h=HOME,a=h.att;
 var att=a?zoneHtml(a)+(a.zone==='Late'?'<div class="form" style="margin-top:8px"><label>Late hone ki wajah (Vinod ji ko jayegi)<input type="text" id="lr"></label><button class="ghost" id="lrb">Wajah bhejo</button></div>':'')+(a.out?'':'<div class="actions"><button class="ghost" id="out">Logout karo</button></div>')
  :'<p class="muted">Check-in '+esc(h.settings.checkinBefore)+' se pehle. Allotted pincode: '+esc(ME.pincodes.join(', ')||'—')+'. Ghar ke '+h.settings.redZone+' m ke andar = Red Zone.</p><label class="chk" style="margin:8px 0"><img id="sth" class="thumb" hidden alt="selfie"><input type="file" id="sf" accept="image/*" capture="user"></label><button class="okb" id="ci" disabled>Check-in karo (selfie + location)</button>';
 $('#view').innerHTML='<div class="grid"><div class="panel"><h3>Attendance – aaj</h3>'+att+'</div>'+
 '<div class="panel"><h3>Mahine ka target</h3><div class="n">'+h.joined+' / '+ME.target+'</div><div class="muted">joinings (Vinod ji accepted)</div><div class="bar"><i style="width:'+pct(h.joined,ME.target)+'%"></i></div><p class="muted">Approval pending '+h.pending+' · Selected '+h.selected+' · Interview fixed '+h.fixed+(h.removedByPayroll?' · <b style="color:var(--bad)">'+h.removedByPayroll+' payroll register me nahi mili</b>':'')+'</p></div>'+
 '<div class="panel"><h3>Aaj ke calls</h3><span class="big">'+h.calls+'</span> <span class="muted">/ '+ME.dailyCalls+'</span><div class="bar"><i style="width:'+pct(h.calls,ME.dailyCalls)+'%"></i></div><div class="actions"><button class="primary" data-c="1">+1 Call</button><button class="ghost" data-c="5">+5 Calls</button></div></div>'+
 '<div class="panel"><h3>Aaj interview fix</h3><span class="big">'+h.fixToday+'</span> <span class="muted">/ '+ME.dailyFix+'</span><div class="bar"><i style="width:'+pct(h.fixToday,ME.dailyFix)+'%"></i></div></div></div>';
 var selfie=null;
 if($('#sf'))$('#sf').onchange=function(e){var f=e.target.files[0];if(!f)return;readImg(f,640,function(d){selfie=d;$('#sth').src=d;$('#sth').hidden=false;$('#ci').disabled=false})};
 if($('#ci'))$('#ci').onclick=function(){gps(function(lat,lng,acc){run('checkIn',TOKEN,selfie,lat,lng,acc,function(x){HOME=x;toast('Check-in: '+x.att.zone);viewHome()})})};
 if($('#out'))$('#out').onclick=function(){gps(function(lat,lng){run('checkOut',TOKEN,lat,lng,function(x){HOME=x;toast('Logout ho gaya');viewHome()})})};
 if($('#lrb'))$('#lrb').onclick=function(){run('lateReason',TOKEN,$('#lr').value,function(){toast('Wajah Vinod ji ko bhej di')})};
 [].forEach.call(document.querySelectorAll('[data-c]'),function(b){b.onclick=function(){run('addCalls',TOKEN,+b.dataset.c,function(x){HOME=x;viewHome()})}})}
function chip(st){var k=st==='Interview fixed'?'Interview':st==='Interview aaya'?'aaya':st==='Approval pending'?'pending':st;return '<span class="chip c-'+k+'">'+esc(st)+'</span>'}
var NEXT={'Interested':'Interview fixed','Interview fixed':'Interview aaya','Interview aaya':'Selected'};
function viewCands(list){
 $('#view').innerHTML='<div class="panel"><h3>Mere Candidates</h3><div class="list">'+(list.map(function(c){var nx=NEXT[c.stage];
  return '<div class="item"><div style="min-width:0"><div class="t">'+esc(c.name)+' <span class="muted">· '+esc(c.emp||c.tmp)+'</span></div><div class="muted">'+esc(c.client)+' · '+esc(c.post)+(c.when?' · '+esc(c.when):'')+'</div>'+
  (c.note?'<div class="err">'+esc(c.note)+'</div>':'')+(c.stage==='Approval pending'?'<div class="muted">Vinod ji ke accept ka intezaar</div>':'')+(c.inPayroll==='N'?'<div class="err">Client payroll register me naam nahi mila</div>':'')+

 else if(TAB==='users'){v.innerHTML='<div class="panel"><h3>Saare logins – Vinod ji, Nirmala, recruiters, Master</h3><p class="muted">Yahan se kisi ka bhi PIN badlo, login band/chalu karo, role badlo, ya naya login banao. PIN khaali chhodoge to purana hi rahega.</p><div class="tbl"><table><tr><th>Code</th><th>Naam</th><th>Role</th><th>PIN</th><th>Pad / Target / Calls / Fix</th><th>Clients</th><th>Pincodes</th><th>Ghar lat, lng</th><th>Phone / Email</th><th>Active</th><th></th></tr>'+
  d.users.concat([{code:'',name:'',role:'Recruiter',pin:'',designation:'',target:'20',dailyCalls:'35',dailyFix:'5',clients:'',pincodes:'302013',homeLat:'',homeLng:'',phone:'',email:'',active:true,accepted:'',isNew:true}]).map(function(x){return '<tr class="ur"><td><input type="text" class="u_code" value="'+esc(x.code)+'" '+(x.isNew?'placeholder="Naya code"':'readonly')+' style="width:90px"></td><td><input type="text" class="u_name" value="'+esc(x.name)+'" style="width:150px"></td><td><select class="u_role">'+['Recruiter','Admin','Compliance','Master'].map(function(r){return '<option '+(r===x.role?'selected':'')+'>'+r+'</option>'}).join('')+'</select></td><td><span class="muted">'+esc(x.pin)+'</span><input type="text" class="u_pin" placeholder="naya PIN" style="width:80px"></td><td><input type="text" class="u_des" value="'+esc(x.designation)+'" style="width:120px"> <input type="number" class="u_t" value="'+esc(x.target)+'" style="width:60px"> <input type="number" class="u_dc" value="'+esc(x.dailyCalls)+'" style="width:60px"> <input type="number" class="u_df" value="'+esc(x.dailyFix)+'" style="width:55px"></td><td><input type="text" class="u_cl" value="'+esc(x.clients)+'" style="width:150px"></td><td><input type="text" class="u_pc" value="'+esc(x.pincodes)+'" style="width:110px"></td><td><input type="text" class="u_hl" value="'+esc(x.homeLat?x.homeLat+', '+x.homeLng:'')+'" style="width:140px"></td><td><input type="tel" class="u_ph" value="'+esc(x.phone)+'" style="width:110px"><input type="email" class="u_em" value="'+esc(x.email)+'" style="width:170px"></td><td><input type="checkbox" class="u_ac" '+(x.active?'checked':'')+'>'+(x.role==='Recruiter'?'<label class="chk" style="font-size:12px"><input type="checkbox" class="u_ra"> offer dobara accept</label>':'')+'</td><td><button class="primary u_sv">'+(x.isNew?'Banao':'Save')+'</button></td></tr>'}).join('')+'</table></div></div>';}
 else if(TAB==='set'){v.innerHTML='<div class="panel"><h3>Settings</h3><div class="tbl"><table><tr><th>Setting</th><th>Value</th><th>Matlab</th><th></th></tr>'+d.settings.map(function(x){return '<tr><td><b>'+esc(x.key)+'</b></td><td><input type="text" class="sv_v" data-k="'+esc(x.key)+'" value="'+esc(x.value)+'" style="min-width:220px"></td><td class="muted">'+esc(x.note)+'</td><td><button class="primary sv_b">Save</button></td></tr>'}).join('')+'</table></div></div>';}
 else if(TAB==='as'){v.innerHTML='<div class="panel"><h3>Kisi ke bhi login me jao</h3><p class="muted">App bilkul waise khulega jaise us bande ko dikhta hai – Vinod ji, Nirmala ya koi recruiter. Wahan jo bhi karoge wo log me "Login-as" ke saath likha jayega. Upar peeli patti se wapas Master par aa jaoge.</p><div class="list">'+d.users.filter(function(x){return x.role!=='Master'}).map(function(x){return '<div class="item"><div><div class="t">'+esc(x.name)+' <span class="muted">· '+esc(x.code)+' · '+esc(x.role)+(x.active?'':' · BAND')+'</span></div></div><button class="primary" data-as="'+esc(x.code)+'">Iske roop me kholo</button></div>'}).join('')+'</div></div>';}
 bindMaster()}
function bindMaster(){var on=function(sel,fn){[].forEach.call(document.querySelectorAll(sel),function(b){b.onclick=function(){fn(b)}})};

 on('.fb',function(b){var tr=b.closest('tr');run('forceStage',TOKEN,tr.querySelector('.fs').dataset.t,tr.querySelector('.fs').value,tr.querySelector('.fn').value,function(d){MDATA=d;toast('Stage badal diya');masterRender()})});
 on('.u_sv',function(b){var tr=b.closest('tr'),g=function(c){return tr.querySelector(c)},hl=g('.u_hl').value.split(',').map(function(x){return x.trim()});
   run('saveUser',TOKEN,{code:g('.u_code').value,name:g('.u_name').value,role:g('.u_role').value,pin:g('.u_pin').value,designation:g('.u_des').value,target:g('.u_t').value,dailyCalls:g('.u_dc').value,dailyFix:g('.u_df').value,clients:g('.u_cl').value,pincodes:g('.u_pc').value,homeLat:hl[0]||'',homeLng:hl[1]||'',phone:g('.u_ph').value,email:g('.u_em').value,active:g('.u_ac').checked,resetAccept:g('.u_ra')?g('.u_ra').checked:false},function(d){MDATA=d;toast('Login save ho gaya');masterRender()})});
 on('.sv_b',function(b){var i=b.closest('tr').querySelector('.sv_v');run('saveSettingM',TOKEN,i.dataset.k,i.value,function(d){MDATA=d;toast('Setting save');masterRender()})});
 on('[data-as]',function(b){run('loginAs',TOKEN,b.dataset.as,function(r){MASTER={token:TOKEN,me:ME};TOKEN=r.token;ME=r.me;TAB=null;saveSess();render()})});}
function attView(){var t=new Date(),iso=function(x){return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)};var f=new Date(t);f.setDate(1);
 $('#view').innerHTML='<div class="panel"><h3>Attendance – sab recruiters</h3><div class="form2" style="max-width:520px"><label>Se<input type="date" id="af1" value="'+iso(f)+'"></label><label>Tak<input type="date" id="af2" value="'+iso(t)+'"></label></div><div id="ares" style="margin-top:10px"></div></div>';
 var load=function(){run('attendanceRange',TOKEN,$('#af1').value,$('#af2').value,function(r){$('#ares').innerHTML='<div class="tbl"><table><tr><th>Date</th><th>Recruiter</th><th>In / Out</th><th>Zone</th><th>Pincode / ghar se</th><th>Proof</th><th>Zone badlo</th></tr>'+r.map(function(a){return '<tr><td>'+esc(a.date)+'</td><td>'+esc(a.name)+' <span class="muted">'+esc(a.code)+'</span></td><td>'+esc(a.in)+' / '+esc(a.out||'—')+'</td><td>'+zonePill(a)+'</td><td>'+esc(a.pin)+' / '+esc(a.dist||'—')+' m</td><td>'+(a.selfie?'<a href="'+esc(a.selfie)+'" target="_blank">Selfie</a>':'')+(a.map?' · <a href="'+esc(a.map)+'" target="_blank">Map</a>':'')+'</td><td><select class="oz"><option>Green</option><option>Late – approved</option><option>Red – absent</option><option>Leave</option></select> <button class="ghost ob" data-row="'+a.row+'" style="padding:5px 10px;font-size:13px">Lagao</button></td></tr>'}).join('')+'</table></div>'||'<p class="muted">Is range me koi attendance nahi.</p>';
   [].forEach.call(document.querySelectorAll('.ob'),function(b){b.onclick=function(){run('overrideAttendance',TOKEN,b.dataset.row,b.closest('tr').querySelector('.oz').value,function(){toast('Zone badal diya');load()})}})})};
 $('#af1').onchange=load;$('#af2').onchange=load;load()}

render();
